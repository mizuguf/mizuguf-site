<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | Feel Good Balance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Feel Good Balance</h1>
  </header>

  <nav class="site-nav">
    <a href="index.html">TOP</a>
    <a href="apps.html">アプリ一覧</a>
    <a href="about.html">About</a>
    <a href="contact.html">お問い合わせ</a>
  </nav>

  <main class="content-wrapper">
    <article class="card">
      <div class="card-title-bar">
        <h2>お問い合わせ</h2>
      </div>
      <div class="card-body">

        <!--
          【Formspree の設定方法】
          1. https://formspree.io でアカウント作成（無料プランで月50件まで受信可能）
          2. 「New Form」を作成し、受信するメールアドレスを設定
          3. 発行されたフォームIDで下記の YOUR_FORM_ID を置き換える
             例: action="https://formspree.io/f/xpwzabcd"
        -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

          <div class="form-group">
            <label for="name">氏名</label>
            <input type="text" id="name" name="name">
          </div>

          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email">
          </div>

          <div class="form-group">
            <label for="subject">題名</label>
            <input type="text" id="subject" name="subject">
          </div>

          <div class="form-group">
            <label for="message">メッセージ本文 (任意)</label>
            <textarea id="message" name="message"></textarea>
          </div>

          <button type="submit" class="submit-btn">送信</button>

        </form>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <span class="footer-brand">Feel Good Balance</span>
    <div class="footer-right">
      <nav class="footer-nav">
        <a href="index.html">TOP</a>
        <a href="apps.html">アプリ一覧</a>
        <a href="about.html">About</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>
      <p class="copyright">Copyright © 2021 Fumiya Mizuguchi All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
